services:
  ner-ai:
    build: .
    container_name: ner-ai
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      # Bound to loopback: the app is reached through Caddy (see
      # Caddyfile.example), never directly from the internet. Publishing
      # "3000:3000" instead would expose it on every interface and let people
      # bypass TLS by hitting the server's IP on that port.
      #
      # Only the HOST side is configurable — the app always listens on 3000
      # inside the container. Set APP_PORT in a `.env` file next to this one
      # if 3000 is already taken on the host (compose reads ${VAR} from `.env`
      # specifically, which is why this one value doesn't live in .env.docker).
      # Whatever you choose must match the port in your Caddy block.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ner-ai-net

  postgres:
    image: postgres:16-alpine
    container_name: ner-ai-postgres
    restart: unless-stopped
    # Reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from the same file
    # as the app. (Compose's ${VAR} substitution only auto-loads a file named
    # ".env", so keeping everything in .env.docker avoids splitting the
    # database password across two files and letting them drift apart.)
    env_file:
      - .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # User/db names are fixed by convention; only the password is a secret.
      test: ["CMD-SHELL", "pg_isready -U ner_ai -d ner_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ner-ai-net

volumes:
  pgdata:

networks:
  ner-ai-net:
    driver: bridge
