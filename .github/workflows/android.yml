name: Build Android app

# Builds the Trusted Web Activity wrapper around chat.heineraboka.site and
# uploads the installable APK (plus the Play Store bundle) as artifacts.
#
# Runs on GitHub's machines on purpose: an Android SDK plus Gradle caches is
# 6-8GB, which the deployment machine doesn't have to spare.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version shown to users (e.g. 1.0.1)"
        required: false
        default: "1.0.0"
      versionCode:
        description: "Internal build number — must increase every release"
        required: false
        default: "1"
  push:
    paths:
      - "twa-manifest.json"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate the Android SDK
        # Deliberately not android-actions/setup-android: every action here is
        # GitHub's own, so the build still runs under a repository policy that
        # only permits first-party actions. GitHub's Ubuntu image already ships
        # the SDK; the download is just a fallback if that ever changes.
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/cmdline-tools" ] && [ ! -d "$SDK/platform-tools" ]; then
            echo "No preinstalled SDK found — fetching the command line tools."
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi
          echo "Using Android SDK at $SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the runner's JDK and SDK
        # Without this it tries to download its own copies interactively, which
        # never completes on CI.
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore or create the signing key
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Using the existing signing key from repository secrets."
          else
            # First run: no key exists yet. Generate one and publish it as an
            # artifact so it can be stored as a secret. EVERY later build must
            # reuse it — Android refuses to update an app signed with a
            # different key, so losing it means uninstall/reinstall for
            # everyone (and a dead listing if it ever reaches the Play Store).
            echo "No ANDROID_KEYSTORE_BASE64 secret found — generating a new signing key."
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias nerkyot \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-nerkyot}" \
              -keypass "${KEYSTORE_PASSWORD:-nerkyot}" \
              -dname "CN=NerKyot, OU=NerKyot, O=NerKyot, L=, ST=, C=PH"
            base64 -w0 android.keystore > android.keystore.base64
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the certificate fingerprint
        id: fingerprint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          FP=$(keytool -list -v -keystore android.keystore -alias nerkyot \
                -storepass "${KEYSTORE_PASSWORD:-nerkyot}" \
                | grep -E "SHA256:" | head -1 | sed -E 's/.*SHA256: *//' | tr -d ' ')
          echo "sha256=$FP" >> "$GITHUB_OUTPUT"
          {
            echo "### Certificate fingerprint"
            echo ""
            echo '```'
            echo "$FP"
            echo '```'
            echo ""
            echo "Set this as \`ANDROID_CERT_FINGERPRINT\` in the server's \`.env.docker\`,"
            echo "along with \`ANDROID_PACKAGE_NAME=site.heineraboka.chat\`, then redeploy."
            echo "Until then the app works but Chrome keeps a URL bar visible."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply version inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            m.appVersionName = '${{ inputs.versionName }}';
            m.appVersion = '${{ inputs.versionName }}';
            m.appVersionCode = Number('${{ inputs.versionCode }}');
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          "

      - name: Check the toolchain Bubblewrap sees
        run: bubblewrap doctor || true

      - name: Generate the Android project
        # `build` compiles an existing Android project; it doesn't create one.
        # Only twa-manifest.json is committed (the generated Gradle project is
        # derived output), so it gets regenerated here. `update` is the
        # non-interactive path — `init` prompts for every value.
        run: bubblewrap update --skipVersionUpgrade

      - name: Build the app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Passwords are read from these env vars — there are no CLI flags for
          # them, and without them the build stops at an interactive prompt.
          export BUBBLEWRAP_KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD:-nerkyot}"
          export BUBBLEWRAP_KEY_PASSWORD="${KEYSTORE_PASSWORD:-nerkyot}"
          # --skipPwaValidation: the site requires a login, so the validator
          # only ever sees the sign-in page and scores it as a failure. The
          # manifest, icons and service worker are verified separately by the
          # PWA test suite.
          # The failure tail is echoed as an annotation because raw job logs
          # need authentication to read, while annotations don't — so a broken
          # build can be diagnosed from the run itself.
          if ! bubblewrap build \
                --skipPwaValidation \
                --signingKeyPath=./android.keystore \
                --signingKeyAlias=nerkyot 2>&1 | tee /tmp/build.log; then
            MSG=$(tail -45 /tmp/build.log \
                  | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=bubblewrap build failed::$MSG"
            exit 1
          fi

      - name: Show what was produced
        run: ls -lh ./*.apk ./*.aab 2>/dev/null || true

      - name: Upload the installable app
        uses: actions/upload-artifact@v4
        with:
          name: nerkyot-android
          path: |
            *.apk
            *.aab
          if-no-files-found: error

      - name: Upload the new signing key (first build only)
        if: steps.keystore.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SIGNING-KEY-store-this-somewhere-safe
          path: |
            android.keystore
            android.keystore.base64
          retention-days: 1
          if-no-files-found: error
